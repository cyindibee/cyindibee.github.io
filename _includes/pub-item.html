<li class="pub">
  {% if include.p.image %}
    <img class="thumb" src="{{ include.p.image | relative_url }}" alt="">
  {% else %}
    <div class="thumb placeholder">{{ include.p.venue_short }}</div>
  {% endif %}
  <div>
    <a class="pub-title" href="{{ include.p.url | relative_url }}">{{ include.p.title }}</a>
    <div class="authors">{{ include.p.authors }}</div>
    <div class="venue">{{ include.p.venue }}</div>
    <div class="links">
      {% for l in include.p.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    </div>
  </div>
</li>
